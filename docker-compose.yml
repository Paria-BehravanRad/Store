services:
  postgres:
    image: postgres:16-alpine
    container_name: viraplaza-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: viraplaza
      POSTGRES_PASSWORD: viraplaza
      POSTGRES_DB: viraplaza
    volumes:
      - viraplaza_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viraplaza -d viraplaza"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: viraplaza-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - viraplaza_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  viraplaza_pg:
  viraplaza_redis:
